services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: learnmate-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=LearnMate
      - DEBUG=false
      - FRONTEND_URL=http://localhost
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: learnmate-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
